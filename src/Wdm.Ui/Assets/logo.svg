<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient: Deep Fluent Mica Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0a0c12" />
    </linearGradient>

    <!-- Edge Highlight for Outer Tile -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Downward Arrow Core: Modern Vibrant Cyan-to-Blue -->
    <linearGradient id="arrowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Multi-thread Segment Glow / Gradient -->
    <linearGradient id="threadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Tray Horizon Accent -->
    <linearGradient id="trayGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Smooth Depth Shadow -->
    <filter id="fluentShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="softArrowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Tile Plate -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#bgGrad)" filter="url(#fluentShadow)" />
  <rect x="48.5" y="48.5" width="415" height="415" rx="95.5" fill="none" stroke="url(#rimGrad)" stroke-width="1.5" />

  <!-- Multi-Segment Acceleration Streams (Parallel Threads) -->
  <g id="segmented-threads">
    <rect x="188" y="96" width="6" height="52" rx="3" fill="url(#threadGrad)" opacity="0.4" />
    <rect x="253" y="80" width="6" height="68" rx="3" fill="url(#threadGrad)" opacity="0.9" />
    <rect x="318" y="96" width="6" height="52" rx="3" fill="url(#threadGrad)" opacity="0.4" />
  </g>

  <!-- Geometric Download Symbol (Clean Fluent Silhouette) -->
  <g id="arrow" filter="url(#softArrowGlow)">
    <path d="M 256 344 
             L 148 236 
             A 10 10 0 0 1 155 219 
             L 214 219 
             A 6 6 0 0 0 220 213 
             L 220 162 
             A 10 10 0 0 1 230 152 
             L 282 152 
             A 10 10 0 0 1 292 162 
             L 292 213 
             A 6 6 0 0 0 298 219 
             L 357 219 
             A 10 10 0 0 1 364 236 
             Z" fill="url(#arrowGrad)" />

    <!-- Pure White Top Rim Accent -->
    <path d="M 230 153 L 282 153" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- High-Precision Base Tray (Data Storage & Catch Plate) -->
  <g id="base-plate">
    <!-- Ambient Horizon Light -->
    <line x1="150" y1="384" x2="362" y2="384" stroke="url(#trayGlow)" stroke-width="2" stroke-linecap="round" />

    <!-- Structured Cradle Bracket -->
    <path d="M 144 356 
             L 144 384 
             A 16 16 0 0 0 160 400 
             L 352 400 
             A 16 16 0 0 0 368 384 
             L 368 356" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Storage Bus Buffer Dots (Active Network Segments) -->
    <circle cx="216" cy="384" r="3" fill="#64748b" />
    <circle cx="256" cy="384" r="3.5" fill="#38bdf8" />
    <circle cx="296" cy="384" r="3" fill="#64748b" />
  </g>
</svg>