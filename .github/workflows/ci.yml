name: ci

# Build and test every pull request (including Dependabot's) on Windows. Releases are built by release.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build and test (solution, including the WPF UI)
        run: dotnet test Wdm.slnx -c Release --nologo

      - name: Extension tests
        run: node --test "tests/extension/*.test.mjs"
