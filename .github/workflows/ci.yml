name: ci

# Build and test every pull request (including Dependabot's) on Windows. Releases are built by release.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The desktop crate embeds src-ui/dist at compile time, so the UI must exist before any cargo step
      - name: Build frontend
        shell: pwsh
        run: |
          cd src-ui
          npm ci
          npm run build

      - name: Rust workspace tests
        run: cargo test --workspace --verbose

      - name: Rust clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Extension tests
        run: node --test "tests/extension/*.test.mjs"
