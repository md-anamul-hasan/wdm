name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only the final "gh release create" step needs this
    env:
      # Set the SIGNPATH_ORGANIZATION_ID repository variable and SIGNPATH_API_TOKEN secret once SignPath approves the project.
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Wdm.slnx -c Release --nologo

      - name: Extension tests
        run: node --test "tests/extension/*.test.mjs"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Publish binaries
        run: ./scripts/build-installer.ps1 -PublishOnly
        shell: pwsh

      # ---- sign WDM's own binaries before packaging
      - name: Collect binaries to sign
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/unsigned | Out-Null
          Get-ChildItem dist/stage -File | Where-Object { $_.Name -like 'Wdm*.exe' -or $_.Name -like 'Wdm*.dll' } | Copy-Item -Destination dist/unsigned
      - name: Upload binaries
        if: env.SIGN == 'true'
        id: upload-binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-unsigned
          path: dist/unsigned/*
      - name: Sign binaries
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: wdm
          signing-policy-slug: release-signing
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed
      - name: Replace with signed binaries
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item dist/signed/* dist/stage -Force

      - name: Build installer
        run: ./scripts/build-installer.ps1 -SkipPublish
        shell: pwsh

      # ---- sign the installer
      - name: Upload installer
        if: env.SIGN == 'true'
        id: upload-installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-unsigned
          path: dist/installer/WDM-Setup-*.exe
      - name: Sign installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: wdm
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-installer
      - name: Replace with signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item dist/signed-installer/WDM-Setup-*.exe dist/installer -Force

      - name: Package release files
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item "dist/installer/WDM-Setup-$v.exe" dist/release
          Compress-Archive -Path extension/* -DestinationPath "dist/release/WDM-Extension-$v.zip"
          # LF endings so `sha256sum -c` works on Linux and macOS too
          $sums = Get-ChildItem dist/release -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          [IO.File]::WriteAllText("$PWD/dist/release/SHA256SUMS.txt", ($sums -join "`n") + "`n")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: dist/release/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $notes = "docs/release-notes-$v.md"
          if (-not (Test-Path $notes)) { throw "Missing $notes - write the release notes before tagging" }
          $tag = "${{ github.ref_name }}"
          # Idempotent: a release may already exist (created in the web UI, or this job is being re-run)
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/release/* --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
            gh release edit $tag --title "WDM $v" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed" }
          } else {
            gh release create $tag dist/release/* --title "WDM $v" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
