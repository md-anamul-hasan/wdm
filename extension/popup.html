<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WDM Download Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h2><img class="logo-icon" src="icon48.png" alt="WDM Icon" title="WDM Icon" width="20" height="20" /> WDM Integration <span class="status-badge" id="hostStatus">Ready</span></h2>
  <div class="subtitle">Windows Download Manager</div>

  <div class="input-group">
    <input type="text" id="urlInput" placeholder="Paste URL to download..." />
    <button id="downloadBtn">Send to WDM</button>
  </div>

  <label class="toggle"><input type="checkbox" id="takeoverToggle" checked /> Take over browser downloads</label>

  <div class="footer">
    Multi-Connection Dynamic Engine v<span id="version"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
