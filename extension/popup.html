<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #1e1e1e;
      color: #ffffff;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      background: #059669;
      color: white;
    }
    .input-group {
      margin-top: 14px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #3f3f46;
      background: #27272a;
      color: white;
      font-size: 12px;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 9px;
      border: none;
      border-radius: 6px;
      background: #0284c7;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #0369a1;
    }
    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: #a1a1aa;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>⚡ WDM Integration <span class="status-badge" id="hostStatus">Ready</span></h2>
  <div style="font-size: 12px; color: #d4d4d8;">Windows Download Manager</div>
  
  <div class="input-group">
    <input type="text" id="urlInput" placeholder="Paste URL to download..." />
    <button id="downloadBtn">Send to WDM</button>
  </div>

  <div class="footer">
    Multi-Connection Dynamic Engine v1.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
