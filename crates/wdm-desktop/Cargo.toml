[package]
name = "wdm-desktop"
description = "WDM Tauri Desktop Application Core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Serve the bundled UI from the binary. Without it a plain `cargo build` loads the Vite dev server
# (http://localhost:1420) and shows an empty window; only the `tauri` CLI used to turn this on.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wdm-core = { path = "../wdm-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
chrono.workspace = true
url.workspace = true
uuid.workspace = true
tracing.workspace = true
open = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
